<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TFE 1 · EK · Laborbuch Gleichrichter</title>
<style>
:root{--rot:#C62828;--tinte:#1a237e;--papier:#fffef8;--linie:#d7e3f4;--grau:#666;--gruen:#2e7d32}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#e9e6df;color:#222}
header{display:flex;align-items:center;gap:18px;padding:12px 22px;background:#fff;border-bottom:3px solid var(--rot)}
header img{height:56px}
header small{color:var(--rot);font-weight:bold;font-size:.8rem;display:block}
header h1{margin:2px 0 0;font-size:1.3rem}
.wrap{max-width:1050px;margin:18px auto;display:grid;grid-template-columns:210px 1fr;gap:0;box-shadow:0 4px 18px rgba(0,0,0,.18)}
@media(max-width:760px){.wrap{grid-template-columns:1fr}}
nav{background:#37474f;color:#fff;padding:14px 0}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#fff;padding:10px 16px;font-size:.95rem;cursor:pointer;border-left:4px solid transparent}
nav button.akt{background:#263238;border-left-color:var(--rot)}
nav button.zu{color:#90a4ae}
nav .fort{margin:14px 16px 0;font-size:.8rem;color:#cfd8dc}
nav .balken{height:8px;background:#546e7a;border-radius:4px;margin:6px 16px 0}
nav .balken div{height:8px;background:#81c784;border-radius:4px;width:0}
.seite{background:var(--papier);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 27px,var(--linie) 28px);padding:22px 30px;min-height:540px;border-left:2px solid #f2b8b5}
.seite h2{font-family:Georgia,serif;color:var(--tinte);margin-top:0}
.seite a{color:#0d47a1}
.stempel{display:inline-block;border:2px solid var(--gruen);color:var(--gruen);padding:2px 10px;transform:rotate(-4deg);font-weight:bold;border-radius:4px;margin-left:8px;font-size:.85rem}
.gesperrt{color:var(--grau);font-style:italic}
button.los{background:var(--rot);color:#fff;border:0;border-radius:6px;padding:8px 14px;font-size:.95rem;cursor:pointer}
button.sek{background:#555}
.frage{border-bottom:1px dashed #ccc;padding:9px 0}
.frage label{display:block;margin:3px 0;cursor:pointer}
.fb{margin-top:6px;font-size:.9rem;padding:6px 10px;border-radius:6px;display:none}
.fb.r{background:#e8f5e9;display:block}.fb.f{background:#ffebee;display:block}
.koord{font-size:.75rem;color:var(--grau)}
input[type=text]{width:130px;padding:4px}
table{border-collapse:collapse;margin:8px 0}td,th{border:1px solid #bbb;padding:4px 9px;font-size:.9rem}
footer{max-width:1050px;margin:0 auto 20px;color:var(--grau);font-size:.75rem;display:flex;justify-content:space-between;padding:0 4px}
</style>
</head>
<body>
<header><img src="logo_technikerschule.jpg" alt="Logo Technikerschule Bayreuth – Fahrzeugtechnik und Elektromobilität">
<div><small>EK · LG 2 · TFE 1</small><h1>Laborbuch: Gleichrichterschaltung analysieren – Prüfadapter PA-12</h1></div></header>
<div class="wrap">
<nav id="nav"></nav>
<main class="seite" id="seite"></main>
</div>
<footer><span>EK · LG 2 · Gleichrichter · Laborbuch · zu LS EK 2</span><span>TFE1_EK_index-28</span></footer>
<script>
const P='pdf/';
const SEITEN=[
 {id:'auftrag',t:'Auftrag',html:`<h2>Auftrag: Abnahme Prüfadapter PA-12</h2><p>Die Prüftechnik Oberfranken GmbH braucht ein Abnahme-Messprotokoll für zwei Prüfadapter. Beim P2 brummt das Relais. Sie arbeiten in Messteams zu dritt mit wechselnden Rollen: <b>Messleitung</b>, <b>Protokoll</b>, <b>Sicherheit</b>.</p><ul><li><a href="${P}TFE1_EK_110-Leitsituation-Gleichrichter-28.pdf">Leitsituation mit Schaltplan und Bauteildaten</a></li><li><a href="${P}TFE1_EK_190-Hilfekarten-28.pdf">Hilfekarten H1–H5</a></li></ul><p>Labor 2 wird nach dem Test „Oszilloskop“ freigeschaltet, Labor 3 nach dem Test „Gleichrichter“ (jeweils ab 80 %). Ihr Fortschritt wird nur in diesem Browser gespeichert.</p>`},
 {id:'l1',t:'Labor 1 · Oszilloskop',html:`<h2>Labor 1 – Funktionsgenerator und Oszilloskop <span class="koord">Woche 7–8</span></h2><ul><li><a href="${P}TFE1_EK_120-Infoblatt-Wechselgroessen-Oszilloskop-28.pdf">Infoblatt Wechselgrößen und Oszilloskop</a></li><li><a href="${P}TFE1_EK_121-Labor1-Oszilloskop-28.pdf">Messprotokoll Labor 1</a></li></ul><p>Bedienblätter der Laborgeräte liegen am Platz (TBS 1072C, Toellner).</p><p><button class="los" onclick="starte('t026')">Test „Oszilloskop und Wechselgrößen“</button> <span id="b_t026"></span></p>`},
 {id:'l2',t:'Labor 2 · Gleichrichter',gate:'t026',html:`<h2>Labor 2 – Einpuls- und Brückengleichrichter, Prüfling P2 <span class="koord">Woche 9–11</span></h2><ul><li><a href="${P}TFE1_EK_130-Infoblatt-Gleichrichter-28.pdf">Infoblatt Gleichrichterschaltungen</a></li><li><a href="${P}TFE1_EK_131-Labor2-Gleichrichter-28.pdf">Messprotokoll Labor 2</a></li></ul><p><b>Achtung Masse-Falle:</b> Bei der Brückenschaltung die Oszilloskop-Masse nur am Minuspol anschließen.</p><p><button class="los" onclick="starte('t036')">Test „Gleichrichter“</button> <span id="b_t036"></span></p>`},
 {id:'l3',t:'Labor 3 · Freilauf',gate:'t036',html:`<h2>Labor 3 – Freilaufdiode und Abnahme <span class="koord">Woche 12</span></h2><ul><li><a href="${P}TFE1_EK_140-Infoblatt-Dioden-im-Fahrzeug-28.pdf">Infoblatt Dioden im Fahrzeug</a></li><li><a href="${P}TFE1_EK_141-Labor3-Freilauf-Abnahme-28.pdf">Messprotokoll Labor 3 und Abnahmeprotokoll</a></li><li><a href="${P}TFE1_EK_191-Punktmatrix-28.pdf">Punktmatrix (Selbsteinschätzung)</a></li></ul><p>Abschluss: Laborabnahme durch die Lehrkraft.</p>`}
];
const TESTS={
 t026:{titel:'Test: Oszilloskop und Wechselgrößen',fragen:[
  {k:'IA1',t:'Welche Angabe steht auf einem Trafo mit „12 V~“?',o:['Scheitelwert','Effektivwert','Spitze-Spitze-Wert','Gleichrichtwert'],r:[1],e:'Wechselspannungen werden mit dem Effektivwert angegeben.'},
  {k:'IA3',t:'Scheitelwert einer Sinusspannung mit 12 V Effektivwert (in V)?',num:16.97,tol:0.1,e:'û = √2 · 12 V = 16,97 V.'},
  {k:'IA3',t:'Eine Periode belegt 4 div bei 5 ms/div. Frequenz in Hz?',num:50,tol:0.5,e:'T = 4 · 5 ms = 20 ms; f = 1/T = 50 Hz.'},
  {k:'IA3',t:'Die Spitze liegt 3,5 div über der Nulllinie bei 2 V/div. Effektivwert in V?',num:4.95,tol:0.05,e:'û = 7,0 V; U = 7,0 V / √2 = 4,95 V.'},
  {k:'IB2',t:'Das Bild läuft durch. Was stellen Sie ein?',o:['Ablenkkoeffizient','Triggerpegel/-quelle','Kopplung GND','Helligkeit'],r:[1],e:'Ein stehendes Bild entsteht durch richtige Triggerung.'},
  {k:'IB2',t:'Tastkopf steht auf 10:1, im Menü ist 1× eingestellt. Die Anzeige ist …',o:['10-mal zu groß','10-mal zu klein','richtig'],r:[1],e:'Der Tastkopf teilt durch 10; ohne Korrektur im Menü wird zu wenig angezeigt.'},
  {k:'IA2',t:'Welche Kopplung zeigt nur den Wechselanteil einer Mischspannung?',o:['DC','AC','GND'],r:[1],e:'AC-Kopplung trennt den Gleichanteil ab.'},
  {k:'IC2',t:'Warum werden im Labor alle Oszilloskop-Massen an denselben Punkt gelegt? (mehrere richtig)',o:['Die Kanalmassen sind im Gerät verbunden.','Sonst kann ein Kurzschluss über das Oszilloskop entstehen.','Damit das Bild heller wird.','Die Masse liegt am Schutzleiter.'],r:[0,1,3],multi:true,e:'Kanalmassen sind untereinander und mit dem Schutzleiter verbunden.'}]},
 t036:{titel:'Test: Gleichrichter',fragen:[
  {k:'IA2',t:'Wie viele Dioden leiten bei der B2U-Brücke gleichzeitig?',o:['1','2','4'],r:[1],e:'Je Halbwelle leiten zwei Dioden in Reihe.'},
  {k:'IA2',t:'Pulsfrequenz einer B2U-Schaltung am 50-Hz-Netz (in Hz)?',num:100,tol:0.5,e:'Zwei Kuppen je Periode → 100 Hz.'},
  {k:'IA3',t:'Trafo 18 V (eff.), B2U, Si-Dioden. Scheitelwert an der Last in V?',num:24.06,tol:0.15,e:'û = √2 · 18 V = 25,46 V; minus 1,4 V = 24,06 V.'},
  {k:'IA3',t:'Gleichrichtwert dazu (ohne Glättung) in V?',num:15.32,tol:0.15,e:'U_AV = 2 · 24,06 V / π = 15,32 V.'},
  {k:'IA3',t:'M1U mit û_L = 20 V. Gleichrichtwert in V?',num:6.37,tol:0.05,e:'U_AV = 20 V / π = 6,37 V.'},
  {k:'IA2',t:'Am Brückengleichrichter sieht man nur jede zweite Kuppe. Ursache?',o:['Trafo defekt','eine Diode unterbrochen','Lastwiderstand zu groß'],r:[1],e:'Fällt eine Diode aus, fehlt eine Halbwelle – die Schaltung arbeitet wie M1U.'},
  {k:'IA2',t:'Welche Aufgabe hat die Freilaufdiode am Relais?',o:['Sie erhöht die Anzugsspannung.','Sie begrenzt die Abschaltspannung der Spule.','Sie richtet die Spannung gleich.'],r:[1],e:'Beim Abschalten fließt der Spulenstrom über die Diode weiter, die Spitze wird auf ca. −0,7 V begrenzt.'},
  {k:'IC2',t:'Mit welchem Tastkopf messen Sie die Abschaltspitze?',o:['1:1','10:1'],r:[1],e:'10:1 – die Spitze kann über 100 V erreichen.'}]}
};
function lies(k){try{return JSON.parse(localStorage.getItem('tfe1ek2_'+k))}catch(e){return null}}
function schreib(k,v){try{localStorage.setItem('tfe1ek2_'+k,JSON.stringify(v))}catch(e){}}
function frei(s){return !s.gate||((lies(s.gate)||{}).p>=80)}
let aktiv='auftrag';
function nav(){
  const n=document.getElementById('nav');let h='';let ok=0;
  SEITEN.forEach(s=>{const f=frei(s);h+=`<button class="${s.id===aktiv?'akt':''} ${f?'':'zu'}" onclick="zeige('${s.id}')">${f?'':'🔒 '}${s.t}</button>`});
  ['t026','t036'].forEach(t=>{if((lies(t)||{}).p>=80)ok++});
  h+=`<div class="fort">Fortschritt: ${ok} von 2 Tests</div><div class="balken"><div style="width:${ok*50}%"></div></div>`;
  n.innerHTML=h;
}
function zeige(id){const s=SEITEN.find(x=>x.id===id);aktiv=id;const m=document.getElementById('seite');
  m.innerHTML=frei(s)?s.html+'<div id="quiz"></div>':`<h2>${s.t}</h2><p class="gesperrt">Diese Seite ist noch gesperrt. Bestehen Sie zuerst den Test auf der vorherigen Seite (ab 80 %).</p>`;
  ['t026','t036'].forEach(t=>{const b=document.getElementById('b_'+t);const r=lies(t);if(b&&r)b.innerHTML=r.p>=80?`<span class="stempel">bestanden ${r.p} %</span>`:`${r.p} % – noch nicht bestanden`});
  nav();}
function starte(id){const T=TESTS[id];let h='<h2>'+T.titel+'</h2>';
  T.fragen.forEach((f,i)=>{h+='<div class="frage"><b>'+(i+1)+'. '+f.t+'</b> <span class="koord">('+f.k+')</span><br>';
   if(f.num!==undefined)h+='<input type="text" inputmode="decimal" autocomplete="off" placeholder="z. B. 12,5" id="f'+i+'">';
   else f.o.forEach((o,j)=>h+='<label><input type="'+(f.multi?'checkbox':'radio')+'" name="f'+i+'" value="'+j+'"> '+o+'</label>');
   h+='<div class="fb" id="fb'+i+'"></div></div>';});
  h+='<p><button class="los" onclick="werte(\''+id+'\')">Auswerten</button> <button class="los sek" onclick="document.getElementById(\'quiz\').innerHTML=\'\'">Schließen</button></p><div id="erg"></div>';
  const q=document.getElementById('quiz');q.innerHTML=h;q.scrollIntoView({behavior:'smooth'});}
function werte(id){const T=TESTS[id];let ok=0;const k={};
  T.fragen.forEach((f,i)=>{let r;
   if(f.num!==undefined){const v=parseFloat((document.getElementById('f'+i).value||'').replace(',','.'));r=!isNaN(v)&&Math.abs(v-f.num)<=f.tol;}
   else{const sel=[...document.querySelectorAll('input[name=f'+i+']:checked')].map(x=>+x.value).sort().join();r=sel===f.r.slice().sort().join();}
   if(r)ok++;k[f.k]=k[f.k]||[0,0];k[f.k][1]++;if(r)k[f.k][0]++;
   const fb=document.getElementById('fb'+i);fb.className='fb '+(r?'r':'f');fb.textContent=(r?'Richtig. ':'Nicht richtig. ')+f.e;});
  const p=Math.round(ok/T.fragen.length*100);schreib(id,{p:p,t:Date.now()});
  let h='<p><b>Ergebnis: '+ok+' von '+T.fragen.length+' ('+p+' %)'+(p>=80?' – bestanden, die nächste Laborseite ist frei.':' – noch nicht bestanden. Fehler nacharbeiten und erneut versuchen.')+'</b></p><table><tr><th>Koordinate</th><th>richtig</th></tr>';
  for(const x in k)h+='<tr><td>'+x+'</td><td>'+k[x][0]+' / '+k[x][1]+'</td></tr>';
  document.getElementById('erg').innerHTML=h+'</table>';
  ['t026','t036'].forEach(t=>{const b=document.getElementById('b_'+t);const r=lies(t);if(b&&r)b.innerHTML=r.p>=80?`<span class="stempel">bestanden ${r.p} %</span>`:`${r.p} % – noch nicht bestanden`});
  nav();}
zeige('auftrag');
</script>
</body>
</html>
